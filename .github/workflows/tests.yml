name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Fast pure-Python unit tests for the geometry helpers -- no ROOT, stock Python image.
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install numpy pytest
      - name: Run geometry unit tests
        run: pytest tests/test_geometry.py -v

  # Full ROOT pipeline, end to end, inside the container. Uses a tiny synthetic .root
  # fixture (no real data needed) to prove the RDataFrame read + feature build + training
  # all actually run in the reproducible image.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t anubis-ml .
      - name: Generate synthetic sample + run both pipelines in-container
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" -w /app anubis-ml bash -c '
            set -e
            python3 -c "import ROOT; print(\"ROOT\", ROOT.__version__)"
            python3 tests/make_sample_root.py
            python3 src/features_segments.py data/sample.ANALYSIS.root
            python3 src/train_segments.py
            python3 src/features.py data/sample.ANALYSIS.root
            python3 src/train.py
            echo "PIPELINE OK"
          '
